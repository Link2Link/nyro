# dsh-nyro-usage bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); activate with
# `dsh plugin --profile <name> add link:<this directory>`
# (or the super-injector's dev_install_package, which writes the same state).
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (nyro Admin API proxy routes), and the `dsh.client`
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: nyro-usage
      name: dsh-nyro-usage
