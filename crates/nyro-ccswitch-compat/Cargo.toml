[package]
name = "nyro-ccswitch-compat"
version.workspace = true
edition.workspace = true
license = "Apache-2.0 AND MIT"
description = "Raw-wire cc-switch protocol compatibility layer for Nyro"

[dependencies]
async-stream = "0.3"
base64 = "0.22"
brotli = "7"
bytes = "1"
flate2 = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
# A distinct source identity prevents preserve_order from being feature-unified
# into nyro-core's registry serde_json package.
serde_json_ordered = { package = "serde_json", path = "vendor/serde_json-1.0.149", version = "=1.0.149", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
